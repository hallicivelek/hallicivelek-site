<!-- Project pages for hallicivelek.com, in the style of about me and music. On any page whose address ends in one of
     Cargo's projects, the project's own content is re-laid out (nothing is retyped, the same elements are moved):
       ← things I've made, the title (Cargo's), and the first paragraph as a larger opening line above the pictures
       text joined into real paragraphs, left-aligned, max 700px (Cargo's line breaks were made for centred text)
       a short one-line text right before a picture becomes a small label above it ("Close up", "1 – Frequency")
       pictures at their own size up to 940px; small pictures side by side in pairs (both may have labels)
       Cargo's tags as rounded buttons, then ← previous / next → in Halli's project order
     SEQUENCE projects keep Halli's one-after-another order: no pairs, pictures up to 702px (full width if bigger).
     PROJECTS holds per-project changes Halli asked for. -->
<style>
  #hc-pj { width: min(940px, 92vw); position: relative; left: 50%; transform: translateX(-50%); padding-bottom: 40px;
    font-family: pacaembu, sans-serif; color: rgb(73, 46, 70); text-align: left; }
  #hc-pj * { text-align: left; }
  #hc-pj a.hc-pj-back { display: inline-block; font-size: 15px; font-weight: bold; color: rgb(14, 118, 128); text-decoration: none; margin: 0 0 28px; }
  #hc-pj a.hc-pj-back:hover { background: none !important; color: rgb(14, 118, 128) !important; text-decoration: underline; }
  #hc-pj h1 { font-family: inherit; font-size: 44px; line-height: 1.1; margin: 0 0 14px; font-weight: bold; color: inherit; text-transform: none; }
  #hc-pj .hc-pj-lede { font-size: 22px; line-height: 1.35; margin: 0 0 88px; max-width: 640px; }
  #hc-pj .hc-pj-text { max-width: 600px; margin: 0 0 80px; }   /* room to breathe: Halli controls the pace */
  #hc-pj .hc-pj-text p { font-size: 18px; line-height: 1.6; margin: 0 0 20px; color: inherit; }
  #hc-pj .hc-pj-text a, #hc-pj .hc-pj-lede a { color: rgb(14, 118, 128); }
  #hc-pj .hc-pj-text a:hover, #hc-pj .hc-pj-lede a:hover { background: none !important; color: rgb(14, 118, 128) !important; }
  #hc-pj .hc-pj-fig { margin: 0 0 88px; }
  #hc-pj .hc-pj-fig img { display: block; width: 100%; height: auto; margin: 0 !important; float: none !important; }   /* Cargo's align= floats them */
  #hc-pj .hc-pj-crop { position: relative; overflow: hidden; max-width: 100%; margin: 0;
    box-shadow: 0 1px 2px rgba(73, 46, 70, .12), 0 14px 30px -14px rgba(73, 46, 70, .35); }
  #hc-pj .hc-pj-crop img { position: absolute; max-width: none; height: auto; }
  #hc-pj .hc-pj-label { font-size: 17px; line-height: 1.4; margin: 0 0 14px; font-weight: bold; max-width: 600px; }
  #hc-pj .hc-pj-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin: 0 0 88px; align-items: end; }
  #hc-pj .hc-pj-pair .hc-pj-fig { margin: 0; }
  #hc-pj .hc-pj-block { margin: 0 0 88px; max-width: 100%; }
  #hc-pj .hc-fold { margin-bottom: 88px; }   /* the Romantika fold and its button get the same room as a picture */
  #hc-pj .hc-pj-block iframe { max-width: 100%; float: none !important; margin: 0 !important; }
  #hc-pj .hc-pj-block h1, #hc-pj .hc-pj-block h2 { font-family: inherit; font-size: 27px; line-height: 1.2; margin: 0; color: inherit; }   /* Halli's own headings (mix pages) */
  #hc-pj .hc-pj-block h3, #hc-pj .hc-pj-block h4 { font-family: inherit; font-size: 17px; line-height: 1.4; margin: 0; color: inherit; }
  #hc-pj .hc-pj-block:has(> h1, > h2, > h3, > h4) { margin-bottom: 10px; }
  #hc-pj .hc-pj-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 56px; padding: 0; list-style: none; }
  #hc-pj .hc-pj-tags a { display: inline-block; font-size: 14px; font-weight: bold; text-decoration: none; padding: 6px 13px; border-radius: 999px;
    background: rgba(255, 255, 255, .55); color: rgb(73, 46, 70); }
  #hc-pj .hc-pj-tags a:hover, #hc-pj .hc-pj-tags a:focus-visible { background: #fff !important; color: rgb(73, 46, 70) !important; }
  #hc-pj .hc-pj-pn { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; border-top: 1px solid rgba(73, 46, 70, .18); padding-top: 24px; }
  #hc-pj .hc-pj-pn a { display: flex; gap: 14px; align-items: center; text-decoration: none; color: rgb(73, 46, 70); }
  #hc-pj .hc-pj-pn a:hover { background: none !important; color: rgb(73, 46, 70) !important; }
  #hc-pj .hc-pj-pn a.hc-pj-next { justify-content: flex-end; }
  #hc-pj .hc-pj-pn a.hc-pj-next * { text-align: right; }
  #hc-pj .hc-pj-pn img { width: 72px; height: 72px; object-fit: cover; background: #fff; padding: 4px; box-shadow: 0 1px 2px rgba(73, 46, 70, .15); flex: none; }
  #hc-pj .hc-pj-pn small { display: block; font-size: 13px; opacity: .75; margin-bottom: 2px; }
  #hc-pj .hc-pj-pn b { font-size: 17px; line-height: 1.25; }
  /* Halli's own marks in a project's content (Þroskahjálp calendar and later):
     <div class="hc-label">  label above the next picture (any length)
     <div class="hc-cap">    caption under the picture or row just before it
     <div class="hc-num" data-n="1">  section heading, numbered in a circle (no data-n: no circle)
     <div class="hc-big">    big statement inside the text column
     <div class="hc-row">    a row of small pictures, each <div><img><div class="hc-rc">year<br>name</div></div>
     <div class="hc-video" data-src="…mp4" data-poster="…jpg" data-w="700">  a silent looping video, plays while on screen */
  #hc-pj .hc-pj-fig video { display: block; width: 100% !important; height: auto !important; margin: 0 !important; background: #000; }   /* Cargo sets its own margin on videos */
  #hc-pj .hc-pj-text .hc-num { font-size: 17px; line-height: 1.4; font-weight: bold; margin: 32px 0 14px; }
  #hc-pj .hc-pj-text .hc-num:first-child { margin-top: 0; }
  #hc-pj .hc-pj-text .hc-num[data-n]::before { content: attr(data-n); display: inline-block; width: 1.6em; height: 1.6em; line-height: 1.6em;
    text-align: center; border-radius: 50%; background: rgb(73, 46, 70); color: #fff; font-size: .8em; margin-right: 8px; vertical-align: .08em; }
  #hc-pj .hc-pj-text .hc-big { font-size: 30px; line-height: 1.2; font-weight: bold; margin: 0 0 24px; }
  #hc-pj .hc-cap { font-size: 14px; line-height: 1.45; margin: 10px 0 0; opacity: .75; }
  #hc-pj .hc-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px 18px; align-items: end; }
  #hc-pj .hc-row img { display: block; width: 100%; height: auto; margin: 0 !important; float: none !important; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); }
  #hc-pj .hc-row .hc-rc { font-size: 13px; line-height: 1.35; margin: 8px 0 0; }
  #hc-pj .hc-row .hc-rc span { opacity: .7; }
  #hc-pj a:focus-visible { outline: 3px solid #3BBFC9; outline-offset: 3px; }
  html.hc-pj-on .project_footer, html.hc-pj-on .project_header { display: none !important; }
  @media (max-width: 600px) {
    #hc-pj h1 { font-size: 32px; } #hc-pj .hc-pj-lede { font-size: 19px; margin-bottom: 56px; }
    #hc-pj .hc-pj-text { margin-bottom: 52px; } #hc-pj .hc-pj-fig, #hc-pj .hc-pj-pair, #hc-pj .hc-pj-block, #hc-pj .hc-fold { margin-bottom: 56px; }
    #hc-pj .hc-pj-pair, #hc-pj .hc-pj-pn { grid-template-columns: 1fr; }
    #hc-pj .hc-row { grid-template-columns: repeat(3, 1fr); }
    #hc-pj .hc-pj-text .hc-big { font-size: 25px; }
    #hc-pj .hc-pj-pn a.hc-pj-next { justify-content: flex-start; flex-direction: row-reverse; }
    #hc-pj .hc-pj-pn a.hc-pj-next * { text-align: left; }
  }
</style>
<script>
(function () {
  if (window.__hcProject) return;
  window.__hcProject = true;

  var SEQUENCE = ['Retro-Stefson-Retro-Stefson', 'FM-Belfast-how-to-make-friends'];
  var PROJECTS = {   // Halli's changes, by project address
    'FM-Belfast-how-to-make-friends': { lede: "Visual identity, art direction and design for FM Belfast's debut album, how to make friends" },
    // the seven band photos have a white card and a shadow drawn into the picture: crop to just outside the card
    // (pixels in the 702 × 657 originals) and let the page draw its own shadow
    'Retro-Stefson-Retro-Stefson': { crop: { match: /RetroStefson-(Gylfi|Unnsteinn|Thorbjorg|Haraldur|JonIngvi|Logi|Thordur)/, size: [702, 657], box: [56, 51, 662, 599] } }
  };
  var TAG_NAMES = { artdirection: 'art direction' };
  var SMALL = 560;
  var CAP = 760;     // pictures show at their own size, up to this; a smaller width= in Cargo makes one smaller   // pictures narrower than this sit side by side in pairs

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  function models() { try { return Cargo.View.Thumbnail.collection.models; } catch (e) { return []; } }
  function slugHere() { return decodeURIComponent(location.pathname.replace(/\/+$/, '').split('/').pop() || ''); }
  function projectIndex(slug) {
    var ms = models(), s = slug.toLowerCase();
    for (var i = 0; i < ms.length; i++) if (String((ms[i].attributes || {}).project_url || '').toLowerCase() === s) return i;
    return -1;
  }
  function widthOf(img) { return parseInt(img.getAttribute('width'), 10) || img.naturalWidth || 0; }
  function visibleContent() {
    var all = [].slice.call(document.querySelectorAll('.project_content'));
    return all.filter(function (p) { return p.offsetParent; })[0] || all[0] || null;
  }

  // Cargo's content as tokens: lines of text (inline elements kept), pictures, and other blocks (videos, the fold, …)
  function tokens(box) {
    var out = [], line = [];
    function endLine() { out.push({ line: line }); line = []; }
    [].slice.call(box.childNodes).forEach(function (n) {
      if (n.nodeType === 3) { if (n.textContent.replace(/\s+/g, ' ').trim()) line.push(n); return; }
      if (n.nodeType !== 1) return;
      var tag = n.tagName;
      if (tag === 'BR') { endLine(); return; }
      if (tag === 'IMG') {
        if (line.length) endLine();
        out.push(n.hasAttribute('data-hc-fold') || n.style.display === 'none' ? { hidden: n } : { img: n }); return;
      }
      if (/^(A|SPAN|B|STRONG|I|EM|SMALL|U|SUP|SUB|FONT)$/.test(tag) && !n.querySelector('img, iframe, video')) { line.push(n); return; }
      if (line.length) endLine();
      if (tag === 'A' && n.querySelector('img') && n.children.length === 1) { out.push({ img: n.querySelector('img'), link: n }); return; }
      out.push({ block: n });
    });
    if (line.length) endLine();
    // lines -> paragraphs (an empty line ends a paragraph)
    var res = [], para = null;
    out.forEach(function (t) {
      if (t.line) {
        var has = t.line.some(function (n) { return n.textContent.trim(); });
        if (!has) { para = null; return; }
        if (!para) { para = { para: [] }; res.push(para); }
        para.para.push(t.line);
      } else { para = null; res.push(t); }
    });
    return res;
  }
  function paraText(p) { return p.para.map(function (l) { return l.map(function (n) { return n.textContent; }).join(''); }).join(' ').replace(/\s+/g, ' ').trim(); }
  function paraNode(p, tag, cls) {
    var e = el(tag, cls);
    p.para.forEach(function (l, i) {
      if (i) e.appendChild(document.createTextNode(' '));
      l.forEach(function (n, k) {
        if (n.nodeType === 3) {
          var t = n.textContent.replace(/\s+/g, ' ');
          if (k === 0) t = t.replace(/^\s+/, '');
          if (k === l.length - 1) t = t.replace(/\s+$/, '');
          e.appendChild(document.createTextNode(t));
        } else e.appendChild(n);
      });
    });
    return e;
  }

  function figure(t, seq, crop) {
    var f = el('figure', 'hc-pj-fig'), w = widthOf(t.img);
    var cap = seq ? Math.min(w || 702, 702) : Math.min(w || CAP, CAP);
    f.style.maxWidth = cap + 'px';
    if (t.label) f.appendChild(t.label);
    t.img.removeAttribute('style'); t.img.removeAttribute('align');
    if (crop && crop.match.test(t.img.getAttribute('src') || '')) {
      var b = crop.box, cw = b[2] - b[0], ch = b[3] - b[1], box = el('div', 'hc-pj-crop');
      box.style.width = cw + 'px'; box.style.aspectRatio = cw + ' / ' + ch;
      t.img.style.width = (crop.size[0] / cw * 100) + '%';
      t.img.style.left = (-b[0] / cw * 100) + '%'; t.img.style.top = (-b[1] / ch * 100) + '%';
      box.appendChild(t.link || t.img); f.appendChild(box);
      if (t.cap) f.appendChild(t.cap);
      return f;
    }
    f.appendChild(t.link || t.img);
    if (t.cap) f.appendChild(t.cap);
    return f;
  }

  function titleHere() { return document.title.replace(/\s+-\s+Halli Civelek\s*$/, ''); }
  function build(box, slug, idx) {
    var seq = SEQUENCE.indexOf(slug) >= 0, extra = PROJECTS[slug] || {}, ms = models(), m = idx >= 0 ? (ms[idx].attributes || {}) : { title: titleHere() };
    var list = tokens(box);
    var root = el('div'); root.id = 'hc-pj';
    var back = el('a', 'hc-pj-back', "← things I've made"); back.href = '/'; root.appendChild(back);
    root.appendChild(el('h1', '', String(m.title || slug).replace(/ - /g, ' – ')));

    // the first paragraph (Halli's "what and for whom") becomes the opening line, above the first picture
    var first = list.findIndex ? list.findIndex(function (t) { return t.para; }) : -1;
    var imgsBefore = first > 0 ? list.slice(0, first).filter(function (t) { return t.img || t.block; }).length : 0;
    if (first >= 0 && imgsBefore <= 1) {
      var p = list.splice(first, 1)[0], lede = paraNode(p, 'p', 'hc-pj-lede');
      if (extra.lede) lede.textContent = extra.lede;
      root.appendChild(lede);
    } else if (extra.lede) root.appendChild(el('p', 'hc-pj-lede', extra.lede));

    // Halli's own marks (see the styles): labels and captions join their picture, headings join the text column
    function mark(t, c) { return t && t.block && t.block.classList && t.block.classList.contains(c); }
    // a video mark becomes a picture-like video: silent, looping, playing only while it's on screen
    list.forEach(function (t) {
      if (!mark(t, 'hc-video')) return;
      var d = t.block, v = document.createElement('video');
      v.src = d.getAttribute('data-src'); if (d.getAttribute('data-poster')) v.poster = d.getAttribute('data-poster');
      v.setAttribute('width', d.getAttribute('data-w') || '700'); v.muted = true; v.loop = true; v.playsInline = true;
      v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.preload = 'metadata';
      v.setAttribute('aria-label', d.getAttribute('data-alt') || ''); v.setAttribute('data-hc-video', '');
      delete t.block; t.img = v;
    });
    for (var j = 0; j < list.length; j++) {
      if (mark(list[j], 'hc-label') && list[j + 1] && list[j + 1].img) {
        list[j].block.className = 'hc-pj-label'; list[j + 1].label = list[j].block; list.splice(j, 1); j--; continue;
      }
      if (mark(list[j], 'hc-cap') && j > 0 && (list[j - 1].img || list[j - 1].block)) { list[j - 1].cap = list[j].block; list.splice(j, 1); j--; }
    }
    // a short one-line paragraph right before a picture is that picture's label
    for (var i = 0; i < list.length - 1; i++) {
      var t = list[i], n = list[i + 1];
      if (t.para && t.para.length === 1 && n.img && !n.label && paraText(t).length <= 60) {
        n.label = paraNode(t, 'p', 'hc-pj-label'); list.splice(i, 1); i--;
      }
    }

    var text = null;
    for (var k = 0; k < list.length; k++) {
      var tk = list[k];
      if (tk.para) {
        if (!text) { text = el('div', 'hc-pj-text'); root.appendChild(text); }
        text.appendChild(paraNode(tk, 'p')); continue;
      }
      if (mark(tk, 'hc-num') || mark(tk, 'hc-big')) {
        if (!text) { text = el('div', 'hc-pj-text'); root.appendChild(text); }
        text.appendChild(tk.block); continue;
      }
      text = null;
      if (tk.hidden) { root.appendChild(tk.hidden); continue; }
      if (tk.block) { var b = el('div', 'hc-pj-block'); if (tk.block.classList.contains('hc-fold')) root.appendChild(tk.block); else { b.appendChild(tk.block); if (tk.cap) b.appendChild(tk.cap); root.appendChild(b); } continue; }
      // pairs of small pictures (not in sequence projects)
      var nx = list[k + 1];
      if (!seq && nx && nx.img && (!nx.label || tk.label) && widthOf(tk.img) && widthOf(tk.img) < SMALL && widthOf(nx.img) < SMALL) {
        var pair = el('div', 'hc-pj-pair'); pair.appendChild(figure(tk, false)); pair.appendChild(figure(nx, false));
        [].forEach.call(pair.children, function (f) { f.style.maxWidth = ''; });
        root.appendChild(pair); k++; continue;
      }
      root.appendChild(figure(tk, seq, extra.crop));
    }

    // Cargo's tags as buttons
    var tags = [].slice.call(document.querySelectorAll('.project_footer a[href*="/filter/"]'));
    if (tags.length) {
      var ul = el('ul', 'hc-pj-tags');
      tags.forEach(function (a) {
        var li = el('li'), c = el('a', '', TAG_NAMES[a.textContent.trim()] || a.textContent.trim()); c.href = a.getAttribute('href');
        li.appendChild(c); ul.appendChild(li);
      });
      root.appendChild(ul);
    }
    var keep = el('div'); keep.setAttribute('data-hc-pj-rest', ''); keep.style.display = 'none';
    while (box.firstChild) keep.appendChild(box.firstChild);
    box.appendChild(root); box.appendChild(keep);
    var vids = root.querySelectorAll('video[data-hc-video]');
    if (vids.length) {
      var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var io = new IntersectionObserver(function (es) { es.forEach(function (e) {
        var v = e.target; if (e.isIntersecting && !still) { var p = v.play(); if (p && p.catch) p.catch(function () {}); } else v.pause();
      }); }, { threshold: 0.25 });
      [].forEach.call(vids, function (v) { io.observe(v); if (still) { v.controls = true; } });
    }
    addNav();
  }

  // previous / next in Halli's order: Cargo's project list can arrive after the page, so this is added when it's there
  function addNav() {
    var root = document.getElementById('hc-pj');
    if (!root || root.querySelector('.hc-pj-pn')) return;
    var ms = models(), idx = projectIndex(slugHere());
    if (idx < 0 || ms.length < 2) return;
    {
      var pn = el('nav', 'hc-pj-pn'); pn.setAttribute('aria-label', 'more projects');
      [[-1, '← previous', 'hc-pj-prev'], [1, 'next →', 'hc-pj-next']].forEach(function (d) {
        // step past anything that isn't a real project (Cargo's 'index' page, an untitled draft)
        var j = idx, mm, at, guard = 0;
        do { j = (j + d[0] + ms.length) % ms.length; mm = ms[j]; at = mm.attributes || {}; guard++; }
        while (guard < ms.length && (!at.project_url || /^(index|untitled.*)$/i.test(String(at.project_url)) || /^(index|untitled)$/i.test(String(at.title || '').trim())));
        var a = el('a', d[2]); a.href = '/' + at.project_url;
        var th = document.querySelector('.thumbnail[name="' + mm.id + '"] img');
        var words = el('span'); words.appendChild(el('small', '', d[1])); words.appendChild(el('b', '', String(at.title || at.project_url).replace(/ - /g, ' – ')));
        if (th) { var im = el('img'); im.src = th.currentSrc || th.src; im.alt = ''; im.loading = 'lazy'; a.appendChild(im); }
        if (d[0] > 0) a.insertBefore(words, a.firstChild); else a.appendChild(words);
        pn.appendChild(a);
      });
      root.appendChild(pn);
    }
  }

  function ready() { if (window.__hcPjReady) window.__hcPjReady(); }
  // A project page is known from Cargo's mark on <body> (set before the page is shown), or from its project list
  // (which can arrive seconds later). Using the mark lets the layout happen before anyone sees the page.
  function check() {
    var slug = slugHere(), idx = slug ? projectIndex(slug) : -1;
    var type = document.body ? document.body.getAttribute('data-pagetype') : null;
    var isProject = !!slug && (type === 'project' || idx >= 0);
    var box = isProject ? visibleContent() : null;
    document.documentElement.classList.toggle('hc-pj-on', !!box);
    if (box && !box.querySelector('#hc-pj')) {
      // wait until Cargo has put the project's content in (it arrives after the page changes)
      if (!box.querySelector('img, iframe, video') && !box.textContent.trim()) return;
      build(box, idx >= 0 ? String(models()[idx].attributes.project_url) : slug, idx);
    }
    if (box) { addNav(); ready(); }                                   // laid out: show the page
    else if (type === 'page' || (models().length && idx < 0)) ready(); // not a project: show the page
  }
  var pending = null;
  // checked straight away when the page changes (not a moment later), so the layout is done before the next paint
  new MutationObserver(function () { if (!document.getElementById('hc-pj') || !document.querySelector('#hc-pj .hc-pj-pn')) check(); })
    .observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-pagetype'] });
  // Cargo can fill in the page quietly after its project list arrives, with no further changes to notice:
  // keep looking for a few seconds after every page change
  var poll = null;
  function look() {
    clearInterval(poll); var until = Date.now() + 8000;
    poll = setInterval(function () { check(); if (document.querySelector('#hc-pj .hc-pj-pn') || Date.now() > until) clearInterval(poll); }, 100);
    check();
  }
  addEventListener('popstate', function () { setTimeout(look, 50); });
  document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('a[href]')) setTimeout(look, 50); }, true);
  look();
})();
</script>
