<!-- 1999 mode for hallicivelek.com: the whole site as it might have looked in 1999, in one of two styles.
       Netscape   #c0c0c0 grey, Times, link blue and visited purple, sunken picture frames, bevelled buttons,
                  a status bar ("Document: Done", "Best viewed in Netscape Navigator 4.0 at 800 x 600")
       GeoCities  starry tiled sky, Comic Sans, a scrolling welcome, UNDER CONSTRUCTION, a visitor counter,
                  a rainbow line, gold frames, blinking NEW! on the first three projects, sparkles after the cursor
     Never on by default. Ways in: the "Bottom of the page award" under the project grid (pick your prize:
     Netscape or GeoCities), or the random overlords now and then choose "GeoCities, 1999" (hc-columns).
     While a style is on, "back to 2026" sits next to the blobs' pause button. The style stays on from page to
     page for the visit (sessionStorage) and is gone on the next visit.
     Reduced motion: nothing blinks, scrolls or sparkles. -->
<style>
  /* ---------- Netscape ---------- */
  html.hc-ns, html.hc-ns body { background: #c0c0c0 !important; background-image: none !important; transition: none !important; }
  html.hc-ns body, html.hc-ns body * { font-family: "Times New Roman", Times, serif !important; border-radius: 0 !important; text-shadow: none !important; }
  html.hc-ns body { color: #000 !important; }
  html.hc-ns .site_header, html.hc-ns .mobile_site_header { background: #c0c0c0 !important; border-bottom: 2px solid #808080 !important; box-shadow: 0 2px 0 #fff !important; }
  html.hc-ns .site_header .navigation a, html.hc-ns .mobile_site_header a { color: #0000ee !important; text-decoration: underline !important; background: none !important; }
  html.hc-ns .link_active a { color: #551a8b !important; }
  html.hc-ns .project_content, html.hc-ns .project_content *, html.hc-ns .hc-intro, html.hc-ns .hc-sort-label { color: #000 !important; }
  html.hc-ns .project_content a, html.hc-ns .hc-sort-again { color: #551a8b !important; }
  html.hc-ns .thumb_image { background: #fff !important; border: 2px solid; border-color: #808080 #fff #fff #808080 !important; }
  html.hc-ns .thumbnails .thumb_title, html.hc-ns .thumbnails .thumb_title * { color: #0000ee !important; text-decoration: underline; }
  html.hc-ns .hc-sort-fact { color: #000 !important; opacity: 1; }
  html.hc-ns .hc-blob { opacity: .25 !important; filter: grayscale(1) !important; }
  html.hc-ns button.hc-pause, html.hc-ns .hc-back { background: #c0c0c0 !important; color: #000 !important; border: 2px solid !important;
    border-color: #fff #404040 #404040 #fff !important; box-shadow: none !important; font-family: Arial, Helvetica, sans-serif !important; }
  .hc-ns-bar { display: none; }
  html.hc-ns .hc-ns-bar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 1002; gap: 8px; align-items: center; padding: 3px 8px;
    background: #c0c0c0; border-top: 2px solid #fff; box-shadow: 0 -1px 0 #808080; }
  html.hc-ns .hc-ns-bar span { font: 12px Arial, Helvetica, sans-serif !important; color: #000; padding: 1px 8px; border: 1px solid; border-color: #808080 #fff #fff #808080; white-space: nowrap; overflow: hidden; }
  html.hc-ns .hc-ns-bar span:nth-child(2) { flex: 1; }
  html.hc-ns body { padding-bottom: 26px; }

  /* ---------- GeoCities ---------- */
  html.hc-gc, html.hc-gc body { background-color: #000033 !important; background-size: 110px 110px !important; transition: none !important;
    background-image: radial-gradient(1.5px 1.5px at 12px 18px, #fff 50%, transparent 51%), radial-gradient(1px 1px at 47px 61px, #ffff99 50%, transparent 51%),
      radial-gradient(2px 2px at 80px 30px, #fff 50%, transparent 51%), radial-gradient(1px 1px at 25px 85px, #99ccff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 70px 95px, #fff 50%, transparent 51%) !important; }
  html.hc-gc body, html.hc-gc body * { font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive !important; border-radius: 0 !important; }
  html.hc-gc body, html.hc-gc .project_content, html.hc-gc .project_content * { color: #fff !important; }
  html.hc-gc .project_content a { color: #00ff00 !important; }
  html.hc-gc .site_header, html.hc-gc .mobile_site_header { background: #000066 !important; border-bottom: 4px ridge #ff00ff !important; }
  html.hc-gc .site_header .navigation a, html.hc-gc .mobile_site_header a { color: #00ff00 !important; text-decoration: underline !important; background: none !important; }
  html.hc-gc .site_header img { filter: hue-rotate(160deg) saturate(3); }
  html.hc-gc .hc-intro { color: #ffff00 !important; }
  html.hc-gc .hc-sort-label { color: #fff !important; }
  html.hc-gc .hc-sort-again { color: #ff66ff !important; }
  html.hc-gc .thumb_image { border: 6px ridge #ffcc00 !important; background: #fff !important; }
  html.hc-gc .thumbnails .thumb_title, html.hc-gc .thumbnails .thumb_title * { color: #00ffff !important; text-shadow: 2px 2px 0 #000 !important; }
  html.hc-gc .hc-sort-fact { color: #ffff66 !important; }
  html.hc-gc .hc-blob { opacity: .5 !important; }
  html.hc-gc button.hc-pause, html.hc-gc .hc-back { background: #ff00ff !important; color: #ffff00 !important; border: 3px outset #ff99ff !important; box-shadow: none !important; }
  .hc-gc-top, .hc-new { display: none; }
  html.hc-gc .hc-gc-top { display: block; text-align: center; margin: 0 0 22px; color: #fff; }
  .hc-gc-top .hc-gc-scroll { overflow: hidden; white-space: nowrap; font-size: 20px; font-weight: bold; color: #00ff00 !important; }
  .hc-gc-top .hc-gc-scroll span { display: inline-block; padding-left: 100%; animation: hc-gc-scroll 16s linear infinite; color: #00ff00 !important; }
  @keyframes hc-gc-scroll { to { transform: translateX(-100%); } }
  .hc-gc-top .hc-gc-uc { display: inline-block; margin: 12px 0; padding: 6px 14px; background: repeating-linear-gradient(45deg, #ffcc00 0 14px, #000 14px 28px); }
  .hc-gc-top .hc-gc-uc b { background: #ffcc00; padding: 2px 8px; color: #000 !important; }
  .hc-gc-top .hc-gc-ctr { font-family: "Courier New", monospace !important; background: #000; color: #ff0000 !important; border: 2px inset #888; padding: 1px 6px; letter-spacing: 3px; }
  .hc-gc-top hr { height: 6px; border: 0; margin: 14px 0 0; background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, magenta); }
  @keyframes hc-blink { 50% { visibility: hidden; } }
  html.hc-gc .hc-new { display: inline; margin-left: 6px; color: #ff0000 !important; font-weight: bold; animation: hc-blink 1s steps(1) infinite; }
  .hc-spark { position: fixed; z-index: 2000; pointer-events: none; font: 14px Arial, sans-serif; transition: transform .8s ease-out, opacity .8s ease-out; }

  /* ---------- the way out ---------- */
  .hc-back { position: fixed; z-index: 1001; display: none; height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: #fff;
    font-family: pacaembu, sans-serif; font-size: 16px; color: rgb(73, 46, 70); cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
  html.hc-ns .hc-back, html.hc-gc .hc-back { display: block; }
  .hc-back:focus-visible { outline: 3px solid #3BBFC9; outline-offset: 3px; }

  /* ---------- the bottom of the page award ---------- */
  .hc-award { clear: both; text-align: center; padding: 80px 16px 140px; font-family: pacaembu, sans-serif; color: rgb(73, 46, 70); }
  .hc-award-badge { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(circle at 35% 30%, #ffe27a, #e0a400 70%); box-shadow: 0 0 0 6px #f3dcdf, 0 0 0 9px #e0a400; perspective: 200px; }
  .hc-award-star { font-size: 40px; color: #fff; display: inline-block; line-height: 1; }
  .hc-award-text { display: none; }
  .hc-award-title { font-size: 30px; font-weight: bold; margin: 0 0 6px; }
  .hc-award-sub { font-size: 17px; opacity: .8; margin: 0 0 22px; }
  .hc-award-pick { display: flex; gap: 16px; justify-content: center; align-items: center; font-size: 20px; }
  .hc-award-pick button { font: inherit; font-weight: bold; color: rgb(14, 118, 128); background: none; border: 0; border-bottom: 2px solid currentColor; cursor: pointer; padding: 2px 0; }
  .hc-award-pick button:focus-visible { outline: 3px solid #3BBFC9; outline-offset: 3px; }
  @keyframes hc-spin { to { transform: rotateY(360deg); } }
  html.hc-ns .hc-award-badge { width: 150px; height: 70px; border-radius: 0 !important; background: linear-gradient(#000080, #1084d0); border: 3px solid;
    border-color: #fff #404040 #404040 #fff; box-shadow: 2px 2px 0 #000; }
  html.hc-ns .hc-award-star { font-size: 34px; color: #ffd700 !important; text-shadow: 2px 2px 0 #806000 !important; animation: hc-spin 1.6s linear infinite; }
  html.hc-ns .hc-award-text { display: block; text-align: left; font: bold 11px/1.15 Arial, Helvetica, sans-serif !important; color: #fff !important; letter-spacing: .5px; }
  html.hc-ns .hc-award-pick button { color: #0000ee !important; text-decoration: underline; }
  html.hc-gc .hc-award, html.hc-gc .hc-award * { color: #ffff00 !important; }
  html.hc-gc .hc-award-pick button { color: #00ff00 !important; }
  @media (prefers-reduced-motion: reduce) {
    .hc-gc-top .hc-gc-scroll span { animation: none; padding-left: 0; }
    html.hc-gc .hc-new, html.hc-ns .hc-award-star { animation: none; }
  }
</style>
<script>
(function () {
  if (window.__hcRetroOn) return;
  window.__hcRetroOn = true;
  var KEY = 'hc-1999', MODES = { ns: 'hc-ns', gc: 'hc-gc' };
  var calm = matchMedia('(prefers-reduced-motion: reduce)');
  var mode = 'off';
  try { mode = sessionStorage.getItem(KEY) || 'off'; } catch (e) {}
  if (!MODES[mode]) mode = 'off';

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

  // the visitor counter: counts up by one a day, so it looks alive
  function counter() { var n = 417 + Math.max(0, Math.floor((Date.now() - Date.UTC(2026, 10, 4)) / 864e5)); return ('000000' + n).slice(-6); }

  function set(m) {
    mode = MODES[m] ? m : 'off';
    var h = document.documentElement;
    h.classList.remove('hc-ns', 'hc-gc');
    if (mode !== 'off') h.classList.add(MODES[mode]);
    try { if (mode === 'off') sessionStorage.removeItem(KEY); else sessionStorage.setItem(KEY, mode); } catch (e) {}
    place();
  }
  window.__hcRetro = { set: set, mode: function () { return mode; } };

  // ---- the way out, next to the blobs' pause button ----
  var back = el('button', 'hc-back', '⏻ back to 2026'); back.type = 'button';
  back.addEventListener('click', function () { set('off'); });
  function placeBack() {
    var p = document.querySelector('button.hc-pause'), r = p && p.getBoundingClientRect();
    if (r && r.width) { back.style.right = (innerWidth - r.left + 10) + 'px'; back.style.bottom = Math.max(0, innerHeight - r.bottom) + 'px'; }
    else { back.style.right = '16px'; back.style.bottom = (mode === 'ns' ? 40 : 16) + 'px'; }
  }

  // ---- Netscape's status bar ----
  var bar = el('div', 'hc-ns-bar'); bar.setAttribute('aria-hidden', 'true');
  ['Document: Done', 'Best viewed in Netscape Navigator 4.0 at 800 × 600', '🔒'].forEach(function (t) { bar.appendChild(el('span', '', t)); });

  // ---- GeoCities' welcome ----
  var top = el('div', 'hc-gc-top'); top.setAttribute('aria-hidden', 'true');
  var sc = el('div', 'hc-gc-scroll'); sc.appendChild(el('span', '', "★ Welcome to Halli's HoMePaGe!!! ★ Sign my guestbook ★ Thanx 4 visiting ★"));
  var uc = el('div', 'hc-gc-uc'); uc.appendChild(el('b', '', '🚧 UNDER CONSTRUCTION 🚧'));
  var vis = el('div', '', 'You are visitor # '); var ctr = el('span', 'hc-gc-ctr', counter()); vis.appendChild(ctr);
  top.appendChild(sc); top.appendChild(uc); top.appendChild(vis); top.appendChild(el('hr'));

  // ---- the award under the grid ----
  var award = el('div', 'hc-award');
  var badge = el('div', 'hc-award-badge'); badge.setAttribute('aria-hidden', 'true');
  badge.appendChild(el('span', 'hc-award-star', '★'));
  var bt = el('span', 'hc-award-text'); bt.innerHTML = 'AWARD<br>WINNING<br>SITE'; badge.appendChild(bt);
  award.appendChild(badge);
  award.appendChild(el('p', 'hc-award-title', 'Bottom of the page award'));
  award.appendChild(el('p', 'hc-award-sub', 'Pick your prize:'));
  var pick = el('div', 'hc-award-pick');
  [['ns', 'Netscape'], ['gc', 'GeoCities']].forEach(function (x, i) {
    if (i) pick.appendChild(el('span', '', '–'));
    var b = el('button', '', x[1]); b.type = 'button';
    b.addEventListener('click', function () { set(x[0]); scrollTo({ top: 0, behavior: calm.matches ? 'auto' : 'smooth' }); });
    pick.appendChild(b);
  });
  award.appendChild(pick);

  function place() {
    if (!back.isConnected) document.body.appendChild(back);
    if (!bar.isConnected) document.body.appendChild(bar);
    placeBack();
    var th = document.querySelector('.thumbnails[data-columnize]');
    var onGrid = th && getComputedStyle(th).display !== 'none' && !/blob-?pond|playthings/i.test(location.pathname);
    if (onGrid) { if (award.previousSibling !== th) th.parentNode.insertBefore(award, th.nextSibling); }
    else if (award.isConnected) award.remove();
    var first = document.getElementById('hc-intro') || document.getElementById('hc-sort');
    if (first) { if (top.nextSibling !== first) first.parentNode.insertBefore(top, first); }
    else { var pc = document.querySelector('.project_content'); if (pc && top.parentNode !== pc) pc.insertBefore(top, pc.firstChild); }
    // NEW! on the first three projects in Halli's order
    var ids = [];
    try { ids = Cargo.View.Thumbnail.collection.models.slice(0, 3).map(function (m) { return String(m.id); }); } catch (e) {}
    [].slice.call(document.querySelectorAll('.thumbnail[name]')).forEach(function (t) {
      var title = t.querySelector('.thumb_title'), has = title && title.querySelector('.hc-new'), want = ids.indexOf(t.getAttribute('name')) >= 0;
      if (want && title && !has) title.appendChild(el('span', 'hc-new', 'NEW!'));
      if (!want && has) has.remove();
    });
  }

  // ---- sparkles after the cursor ----
  var last = 0;
  addEventListener('pointermove', function (e) {
    if (mode !== 'gc' || e.pointerType !== 'mouse' || calm.matches) return;
    var now = performance.now(); if (now - last < 35) return; last = now;
    var s = el('span', 'hc-spark', ['✦', '✧', '★', '·'][Math.random() * 4 | 0]);
    s.style.color = ['#ff0', '#f0f', '#0ff', '#fff'][Math.random() * 4 | 0];
    s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px';
    document.body.appendChild(s);
    requestAnimationFrame(function () { s.style.transform = 'translate(' + (Math.random() * 30 - 15) + 'px,' + (20 + Math.random() * 25) + 'px)'; s.style.opacity = '0'; });
    setTimeout(function () { s.remove(); }, 850);
  }, { passive: true });

  var pending = null;
  new MutationObserver(function () { clearTimeout(pending); pending = setTimeout(place, 150); })
    .observe(document.documentElement, { childList: true, subtree: true });
  addEventListener('resize', placeBack);
  addEventListener('popstate', function () { setTimeout(place, 150); });
  if (document.body) set(mode); else document.addEventListener('DOMContentLoaded', function () { set(mode); });
})();
</script>
