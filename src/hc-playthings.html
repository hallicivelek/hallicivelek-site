<!-- Playthings for hallicivelek.com: builds the page whose address contains "playthings".
     Four big cards, each with a live preview of the project:
       Music Kontrapunkt Kontrol  the real blog, shown small, gliding slowly down and back up
       Shakeskin                  Halli and friends' faces from the gallery, one at a time, softly fading into the next
                                  (shakeskin.com doesn't allow being shown inside another page)
       The Calculater             the real calculator, shown small (its own background is animation enough)
       The blob-pond              the real pond in preview mode (?hc-preview: no wake screen, no controls, no sound)
     Whatever Halli puts on the Cargo page stays as the fallback (and for search engines); this script hides it
     and draws the cards. Cargo's project grid (and its sort line) is hidden on this page: playthings ends after
     the cards. With reduced motion nothing glides or shakes. -->
<style>
  html.hc-pt-on .thumbnails, html.hc-pt-on #hc-sort { display: none !important; }
  #hc-pt { width: min(1080px, 92vw); position: relative; left: 50%; transform: translateX(-50%); text-align: left;
    font-family: pacaembu, sans-serif; color: #492E46; padding-bottom: 80px; }
  #hc-pt .hc-pt-intro { font-size: 28px; line-height: 1.35; margin: 0 0 48px; max-width: 780px; }
  #hc-pt .hc-pt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px 48px; }
  @media (max-width: 760px) { #hc-pt .hc-pt-grid { grid-template-columns: 1fr; gap: 40px; } #hc-pt .hc-pt-intro { font-size: 22px; margin-bottom: 32px; } }
  #hc-pt a.hc-pt-card { display: block; color: inherit; text-decoration: none; padding: 14px; margin: -14px; border-radius: 22px;
    background-color: transparent; transition: background-color .2s ease; }
  #hc-pt a.hc-pt-card:hover, #hc-pt a.hc-pt-card:focus-visible { background-color: rgba(255, 255, 255, .2) !important; color: inherit !important; }
  #hc-pt a.hc-pt-card:focus-visible { outline: 3px solid #3BBFC9; outline-offset: 2px; }
  #hc-pt .hc-pt-win { position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; }
  #hc-pt .hc-pt-win iframe { position: absolute; left: 0; top: 0; width: 250%; height: 250%; transform: scale(.4); transform-origin: 0 0;
    border: 0; pointer-events: none; }
  #hc-pt .hc-pt-win iframe.hc-pt-tall { height: 1000%; animation: hc-pt-glide 90s ease-in-out infinite alternate; }
  @keyframes hc-pt-glide { 0%, 12% { top: 0; } 88%, 100% { top: -300%; } }   /* slow, with long rests at the top and bottom */
  #hc-pt .hc-pt-faces img { position: absolute; left: 12%; top: 12%; width: 76%; height: 76%; object-fit: cover; opacity: 0;
    animation: hc-pt-face 42s linear infinite; }
  /* calm: each face fades in over the last one, drifts very slightly closer for 3.5 s, and fades out */
  @keyframes hc-pt-face { 0% { opacity: 0; transform: scale(1); } 2.4% { opacity: 1; } 8.3% { opacity: 1; } 10.7% { opacity: 0; transform: scale(1.04); }
    100% { opacity: 0; transform: scale(1.04); } }
  #hc-pt h2 { font-family: inherit; font-size: 26px; font-weight: bold; line-height: 1.2; margin: 20px 0 6px; color: inherit; text-transform: none; }
  /* one drawn arrow for both: straight (→, on this site) and turned up 45° (↗, opens another site); bold like the title */
  #hc-pt h2 .hc-pt-go { display: inline-block; width: .78em; height: .78em; margin-left: .3em; vertical-align: -.04em; color: rgb(14, 118, 128); }
  #hc-pt h2 .hc-pt-go svg { display: block; width: 100%; height: 100%; overflow: visible; }
  #hc-pt h2 .hc-pt-go.hc-pt-out svg { transform: rotate(-45deg); }
  #hc-pt .hc-pt-line { font-size: 19px; line-height: 1.45; margin: 0; color: inherit; }
  @media (prefers-reduced-motion: reduce) {
    #hc-pt .hc-pt-win iframe.hc-pt-tall { animation: none; }
    #hc-pt .hc-pt-faces img { animation: none; }
    #hc-pt .hc-pt-faces img:first-child { opacity: 1; }
  }
</style>
<script>
(function () {
  if (window.__hcPlaythings) return;
  window.__hcPlaythings = true;
  var PAGE = /playthings/i;
  var INTRO = "Things I've built and kept running (some since 2004).";
  var FACES = ['ufd1236b1cbdd86', '3ffabdafe66c630', '42623ba9596b356', '7662eaad81b67246', 'ee05d41940906d', 'c49534a2653b6d53',
               '9384b19a7957c4e', '629bbdd38af4a7cf', '74f81e1515bb5625', 'e7ffdcebd88ec424', '4e494fd3add96bba', '9f1025e773392387'];
  var THINGS = [
    { title: 'Music Kontrapunkt Kontrol', href: 'https://kontrapunkt.hallicivelek.com/', bg: '#f3efe6', show: 'tall',
      line: 'An Italo Disco blog, and a map of who produced what. Since 2004.' },
    { title: 'Shakeskin', href: 'https://www.shakeskin.com/', bg: '#086eb2', show: 'faces',   // Shakeskin's own blue
      line: 'A gallery of shaken faces. Since 2004.' },
    { title: 'The Calculater', href: 'https://www.thecalculater.net/', bg: '#a77bf0', show: 'still',
      line: 'Input digits and get results. Later.' },
    { title: 'The blob-pond', href: '/the-blob-pond', frame: '/the-blob-pond?hc-preview', bg: '#241B28', show: 'still',
      line: 'Blobs drift across the lines and play notes. Made for sound.' }
  ];

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

  function card(t) {
    var outside = /^https?:/.test(t.href);
    var a = el('a', 'hc-pt-card'); a.href = t.href;
    if (outside) { a.target = '_blank'; a.rel = 'noopener'; }
    var win = el('div', 'hc-pt-win'); win.style.backgroundColor = t.bg;
    if (t.show === 'faces') {
      win.classList.add('hc-pt-faces');
      FACES.forEach(function (f, i) {
        var img = el('img'); img.src = 'https://www.shakeskin.com/photos/' + f + '.jpg'; img.alt = ''; img.loading = 'lazy';
        img.style.animationDelay = (i * 3.5).toFixed(1) + 's'; win.appendChild(img);
      });
    } else {
      var f = el('iframe', t.show === 'tall' ? 'hc-pt-tall' : '');
      f.src = t.frame || t.href; f.loading = 'lazy'; f.tabIndex = -1; f.title = t.title + ' (preview)';
      f.setAttribute('aria-hidden', 'true');
      win.appendChild(f);
    }
    var h = el('h2', '', t.title), go = el('span', 'hc-pt-go' + (outside ? ' hc-pt-out' : ''));
    go.setAttribute('aria-hidden', 'true');
    go.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M3 12h17M13.5 5.5L20 12l-6.5 6.5"/></svg>';
    h.appendChild(go);
    a.appendChild(win); a.appendChild(h); a.appendChild(el('p', 'hc-pt-line', t.line));
    return a;
  }

  function build(box) {
    // Cargo's own content (loose text included) moves into one hidden box: kept as the fallback
    var keep = document.createElement('div'); keep.setAttribute('data-hc-pt-fallback', ''); keep.style.display = 'none';
    while (box.firstChild) keep.appendChild(box.firstChild);
    box.appendChild(keep);
    var root = el('div'); root.id = 'hc-pt';
    root.appendChild(el('p', 'hc-pt-intro', INTRO));
    var grid = el('div', 'hc-pt-grid');
    THINGS.forEach(function (t) { grid.appendChild(card(t)); });
    root.appendChild(grid);
    box.appendChild(root);
  }

  function check() {
    var here = PAGE.test(location.pathname);
    document.documentElement.classList.toggle('hc-pt-on', here);   // Cargo changes pages without reloading
    if (!here) return;
    var box = document.querySelector('.project_content');
    if (box && !box.querySelector('#hc-pt')) build(box);
  }
  var pending = null;
  new MutationObserver(function () { clearTimeout(pending); pending = setTimeout(check, 120); })
    .observe(document.documentElement, { childList: true, subtree: true });
  addEventListener('popstate', check);
  check();
})();
</script>
