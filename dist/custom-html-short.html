<script type="text/javascript">
/**
* Add a filter to your project navigation
*/
function addFilterActive(selector, remove_on_page, active_class) {
   if(typeof Cargo.Helper == "object") {
       var filter = Cargo.Helper.GetActiveFilter();
   } else {
       var filter = Cargo.Location.GetUserFilter();
   }

   var el_selector = (selector) ? $(selector) : $('.link_link');
       active_class = (active_class) ? active_class : "link_active";

   if( $('[href$="filter/'+filter+'"]',el_selector).parent() == selector) {
       $('[href$="filter/'+filter+'"]',el_selector).addClass(active_class);
   } else {
       $('[href$="filter/'+filter+'"]',el_selector).parent().addClass(active_class);
   }

   if(remove_on_page) {
       $(document).bind("projectLoadComplete", function() {
           $("."+active_class).removeClass(active_class);
       });
       $(document).bind("projectCloseComplete", function() {
           addFilterActive(selector, false);
       });
   }
}

$(function() {
   var selector = ".link_link";
   var remove_on_page = false;
   var active_class = "link_active";

   addFilterActive(selector, remove_on_page, active_class);
});
</script>

<!-- ================================================================
     hallicivelek.com — custom add-ons, loaded from GitHub (github.com/hallicivelek/hallicivelek-site)
     1. Two-column fix      projects across two columns, in a random order of the day
     2. Current page in nav  blue + aria-current on every page
     3. Floating blobs      the background blobs, faces, pause button (not on the blob-pond page)
     4. The blob-pond       builds the pond on the page whose address contains "blob-pond"
     5. Eyes                Halli's portrait on the info + contact page looks at you
     6. Playthings          the four project cards on the playthings page
     7. 1999 mode           Netscape or GeoCities, from the award under the grid or the overlords
     8. Music               the music page: Wanton Boys Club, remixes, mixes that play in place
     Each is its own script file, so if one ever breaks (or GitHub is down) the others and the site keep working.
     ================================================================ -->
<script>
(function () {
  var base = 'https://hallicivelek.github.io/hallicivelek-site/dist/js/';
  ['hc-columns', 'hc-nav-active', 'hc-blobs', 'hc-pond', 'hc-eyes', 'hc-playthings', 'hc-retro', 'hc-music', 'hc-debug'].forEach(function (name) {
    var s = document.createElement('script');
    s.src = base + name + '.js';
    s.async = false;
    document.head.appendChild(s);
  });
})();
</script>

<style>
/* Halli: mobile menu */

body.mobile .mobile_site_header {

/* Replace Cargo's icon images with two matching strokes. */

body.mobile .navigation_toggle::before,
body.mobile .navigation_toggle::after {

body.mobile .navigation_toggle:focus-visible {

<script>
(function () {
  function setup() {
    if (window.__hcMobileMenu) return;

    var toggle = document.querySelector(".navigation_toggle");
    var nav = document.querySelector(".site_header .navigation");
    if (!toggle || !nav || !window.jQuery) return;

    window.__hcMobileMenu = true;

    /*
     * Remove Cargo's old behaviour that closes the menu
     * as soon as you touch an empty area.
     * Keep Cargo's existing click handler on the toggle.
     */
    window.jQuery(nav).off("touchstart");

    if (!nav.id) nav.id = "hc-mobile-navigation";

    toggle.setAttribute("role", "button");
    toggle.setAttribute("tabindex", "0");
    toggle.setAttribute("aria-controls", nav.id);
    nav.setAttribute("aria-label", "Main navigation");

    function isOpen() {
      return document.body.classList.contains("mobile") &&
        nav.classList.contains("active");
    }

    function sync() {
      var open = isOpen();
      toggle.setAttribute("aria-expanded", String(open));
      toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      document.documentElement.classList.toggle("hc-menu-open", open);
      document.body.classList.toggle("hc-menu-open", open);
    }

    function closeMenu(returnFocus) {
      nav.classList.remove("active");
      toggle.classList.remove("active");
      sync();
      if (returnFocus) toggle.focus();
    }

    toggle.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggle.click();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (!isOpen()) return;

      if (event.key === "Escape") {
        event.preventDefault();
        closeMenu(true);
      }

      if (event.key === "Tab") {
        var links = Array.from(nav.querySelectorAll("a[href]"))
          .filter(function (link) {
            return link.getClientRects().length > 0;
          });
        var controls = [toggle].concat(links);
        var index = controls.indexOf(document.activeElement);
        var next = event.shiftKey ? index - 1 : index + 1;

        event.preventDefault();
        if (next < 0) next = controls.length - 1;
        if (next >= controls.length) next = 0;
        controls[next].focus();
      }
    });

    nav.addEventListener("click", function (event) {
      if (event.target.closest("a[href]")) {
        closeMenu(false);
      }
    });

    new MutationObserver(sync).observe(nav, {
      attributes: true,
      attributeFilter: ["class"]
    });

    window.addEventListener("resize", sync);
    sync();
  }

  if (document.readyState === "complete") {
    setup();
  } else {
    window.addEventListener("load", setup, { once: true });
  }
})();
</script>
