     1. Two-column fix      projects across two columns, in a random order of the day (facts.txt)
     2. Current page in nav  blue + aria-current on every page
     3. Floating blobs      the background blobs, faces, pause button (not on the blob-pond page)
     4. The blob-pond       builds the pond on the page whose address contains "blob-pond"

<!-- Two-column fix and random sort for hallicivelek.com — part of Cargo's Custom HTML.
     Cargo builds three thumbnail columns; the site's CSS shows two side by side,
     so the third column ended up under the other two. This re-deals the cards
     into two columns in Cargo's own project order.
     Random sort: each visit picks one of Halli's facts (src/facts.txt, filled in by the build)
     and puts the matching projects first, with a line above the grid naming the sort ("sorted by: hands").
     Clicking the line picks another. ?hc-sort=hands previews one.

<!-- Current page in the nav for hallicivelek.com — paste into Cargo's Custom HTML.
     Cargo marks filter pages (art direction, illustration) as active itself, but not
     the "music / mixes" and "info + contact" pages. This marks whichever nav link
     matches the page you're on, using Cargo's own link_active class (so your existing
     blue style applies), and adds aria-current="page" for screen readers on every page. -->
<script>
(function () {
  if (window.__hcNav) return;
  window.__hcNav = true;

  function clean(path) { return path.replace(/\/+$/, '') || '/'; }

  function mark() {
    var links = [].slice.call(document.querySelectorAll('.site_header .navigation a'));
    if (!links.length) return;
    var here = clean(location.pathname);

    // undo our own marking from the previous page
    links.forEach(function (a) {
      if (a.parentElement.hasAttribute('data-hc-active')) {
        a.parentElement.classList.remove('link_active');
        a.parentElement.removeAttribute('data-hc-active');
      }
      a.removeAttribute('aria-current');
    });

    var active = links.filter(function (a) { return a.parentElement.classList.contains('link_active'); })[0];
    if (!active) {
      // Cargo didn't mark anything: find the link for this page (or a page inside it)
      active = links.filter(function (a) {
        var p;
        try { p = clean(new URL(a.href, location.href).pathname); } catch (e) { return false; }
        return p !== '/' && (here === p || here.indexOf(p + '/') === 0);
      })[0];
      if (active) {
        active.parentElement.classList.add('link_active');
        active.parentElement.setAttribute('data-hc-active', '');
      }
    }
    if (active) active.setAttribute('aria-current', 'page');
  }

  // Cargo changes pages without reloading, so check again whenever the page changes
  var lastPath = null, pending = null;
  function check() {
    clearTimeout(pending);
    pending = setTimeout(function () {
      if (location.pathname !== lastPath || !document.querySelector('.site_header [aria-current]')) {
        lastPath = location.pathname;
        mark();
      }
    }, 80);
  }
  new MutationObserver(check).observe(document.body, { childList: true, subtree: true });
  addEventListener('popstate', check);
  document.addEventListener('DOMContentLoaded', check);
  check();
})();
</script>

  function drawPause() { pauseBtn.innerHTML = (paused ? ICON_PLAY + 'wake blobs' : ICON_PAUSE + 'pause blobs'); }

  drawPause();
  document.getElementById('hcp-wakeBtn').addEventListener('click', function () {

  });
  function fitToScreen() {          // checked every frame: if the drawing area changed size, rescale the pond to it

  /* ---------- the loop ---------- */
  var last = performance.now(), t = 0;

        if (b.kind === 'shy' && ptr) { var dx = b.x - ptr.x, dy = b.y - ptr.y, dist = Math.sqrt(dx * dx + dy * dy) || 1, reach = radius(b) + 70;
          if (dist < reach) { var push = (1 - dist / reach) * 2600 * dt; b.ox += dx / dist * push; b.oy += dy / dist * push; } }
        if (curious) { var cx = ptr.x - b.x, cy = ptr.y - b.y, cd = Math.sqrt(cx * cx + cy * cy) || 1;
          var ring = radius(b) + (b.kind === 'shy' ? 110 : 45) + b.personal, pull = cd > ring ? Math.min(1, (cd - ring) / 200) : -0.5;

        b.x += (b.vx * slow + b.ox) * dt; b.y += (b.vy * slow + b.oy) * dt; b.rot += b.vr * pace * dt;

        if (b.x < -m) { b.x = W + m; wrapped = true; } else if (b.x > W + m) { b.x = -m; wrapped = true; }
        if (b.y < -m) { b.y = H + m; wrapped = true; } else if (b.y > H + m) { b.y = -m; wrapped = true; }
        if (wrapped) b.side = [];                                   // a jump across the screen is not a crossing
      } else if (b.state === 'swallowed') {

        if (b.y - radius(b) > H + 20) {                             // drifts back in from the top
          b.state = 'float'; b.y = -radius(b) - 10; b.x = rand(0.15, 0.85) * W; b.tx = b.ty = 1; b.side = [];
          b.vx = rand(-10, 10); b.vy = rand(8, 14);
        }
      }

      // crossing a line plays it
      if ((!paused || b.state === 'falling') && b.state !== 'leaving') {
        lines.forEach(function (L, k) {
          var side = b.y < lineY(L, b.x) ? -1 : 1;
